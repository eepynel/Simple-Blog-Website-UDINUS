<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Web Blog</title>
</head>
<body>
<!-- 1. HEADER -->
    <header class="header">
        <h1 id="sapaan"></h1>
        <p>UAS Dasar-Dasar Komputer - Nathanael Andra Putra</p>
    </header>

    <!-- 2. MENU (NAVIGASI) -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="buku-tamu.html">Buku Tamu</a></li>
        </ul>
    </nav>

    <main class="content">
        <section id="buku-tamu" class="card">
            <h2>Buku Tamu</h2>
            <form id="guestForm">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap Anda!">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required placeholder="Masukkan Email Anda!">
                </div>

                <div class="form-group">
                    <label for="instansi">Instansi / Kampus:</label>
                    <input type="text" id="instansi" required placeholder="Masukkan Instansi/Kampus Anda!">
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori Pengunjung:</label>
                    <select id="kategori" required>
                        <option value="">-- Pilih --</option>
                        <option value="Mahasiswa">Mahasiswa</option>
                        <option value="Dosen">Dosen</option>
                        <option value="Umum">Umum</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pesan">Kritik / Saran:</label>
                    <textarea id="pesan" rows="4" required placeholder="Masukkan Kritik/Saran Anda!"></textarea>
                </div>

                <button type="submit">Kirim</button>
            </form>

            <!-- Output hasil Form -->
            <div id="formResult" class="result-box" style="display: none;">
                <h3>Hasil Input Buku Tamu:</h3>
                <p id="resNama"></p>
                <p id="resEmail"></p>
                <p id="resInstansi"></p>
                <p id="resKategori"></p>
                <p id="resPesan"></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 | Nathanael Andra Putra - A11.2026.16747</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
